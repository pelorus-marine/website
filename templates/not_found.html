<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Pelorus</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/static/pelorus-favicon-32.png" />
    <link rel="stylesheet" href="/static/vendor/bootstrap-5.3.3/bootstrap.min.css" />

    <style>
      @font-face {
        font-family: "Operation Napalm";
        src: url("/static/fonts/operation-napalm-regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root,
      [data-bs-theme="dark"] {
        --bs-body-bg: #0d1117;
        --bs-body-color: #c9d1d9;
        --bs-emphasis-color: #f0f6fc;
        --bs-border-color: #30363d;
        --bs-link-color: #58a6ff;
        --bs-link-hover-color: #79c0ff;
        --bs-secondary-color: #8b949e;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica,
          Arial, sans-serif;
      }

      .navbar {
        background-color: #161b22;
        border-bottom: 1px solid var(--bs-border-color);
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }

      .pelorus-wordmark {
        font-family: "Operation Napalm", system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: 0.04em;
      }

      .navbar-brand {
        color: var(--bs-emphasis-color);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .navbar-brand img {
        width: 24px;
        height: 24px;
      }

      main {
        flex: 1 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 3rem 1rem;
      }

      .not-found h1 {
        font-size: 2rem;
        font-weight: 600;
        color: var(--bs-emphasis-color);
        margin-bottom: 1rem;
      }

      .not-found p {
        color: var(--bs-body-color);
        max-width: 28rem;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 1.5rem;
        line-height: 1.5;
      }

      footer {
        flex-shrink: 0;
        border-top: 1px solid var(--bs-border-color);
        background-color: #161b22;
        color: var(--bs-secondary-color);
        font-size: 0.8rem;
        padding: 1rem 0;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand">
      <div class="container">
        <a class="navbar-brand text-decoration-none" href="/">
          <img src="/static/pelorus-favicon-32.png" alt="" />
          <span class="pelorus-wordmark">Pelorus</span>
        </a>
      </div>
    </nav>

    <main>
      <div class="not-found">
        <h1>Oups</h1>
        <p>
          Nothing here — this page doesn’t exist, or the address has a typo. If you followed a link
          on our side, tell us and we’ll fix the chart.
        </p>
        <a class="btn btn-outline-primary" href="/">Back to home</a>
      </div>
    </main>

    <footer>
      <div class="container">&copy; {{ year }} Pelorus Marine</div>
    </footer>
  </body>
</html>
