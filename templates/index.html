<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelorus</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/static/pelorus-favicon-32.png" />
    <link rel="apple-touch-icon" sizes="200x200" href="/static/pelorus-icon-200.png" />

    <link rel="stylesheet" href="/static/vendor/bootstrap-5.3.3/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/css/pelorus-dial.css" />

    <style>
      @font-face {
        font-family: "Operation Napalm";
        src: url("/static/fonts/operation-napalm-regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root,
      [data-bs-theme="dark"] {
        --bs-body-bg: #0d1117;
        --bs-body-color: #c9d1d9;
        --bs-emphasis-color: #f0f6fc;
        --bs-secondary-bg: #161b22;
        --bs-tertiary-bg: #161b22;
        --bs-border-color: #30363d;
        --bs-border-color-translucent: rgba(240, 246, 252, 0.1);
        --bs-link-color: #58a6ff;
        --bs-link-color-rgb: 88, 166, 255;
        --bs-link-hover-color: #79c0ff;
        --bs-link-hover-color-rgb: 121, 192, 255;
        --bs-secondary-color: #8b949e;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica,
          Arial, sans-serif;
      }

      .navbar {
        background-color: #161b22;
        border-bottom: 1px solid var(--bs-border-color);
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }

      /* Word “Pelorus” only — Operation Napalm (CC0, fonts-cc0) */
      .pelorus-wordmark {
        font-family: "Operation Napalm", system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: 0.04em;
      }

      .navbar-brand {
        color: var(--bs-emphasis-color);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .navbar-brand img {
        width: 24px;
        height: 24px;
      }

      .nav-link {
        color: var(--bs-secondary-color);
        font-size: 0.9rem;
      }

      .nav-link:hover {
        color: var(--bs-emphasis-color);
      }

      main {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      /* Typography for hero content (layout: static/css/pelorus-dial.css) */
      .hero-content-layer h1 {
        font-size: 2.25rem;
        font-weight: 600;
        color: var(--bs-emphasis-color);
        margin-bottom: 0.75rem;
      }

      .hero-content-layer .tagline {
        font-style: italic;
        color: var(--bs-body-color);
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }

      .hero-content-layer .why-link {
        font-size: 0.85rem;
        color: var(--bs-secondary-color);
        text-decoration: none;
        border-bottom: 1px dotted var(--bs-secondary-color);
      }

      .hero-content-layer .why-link:hover {
        color: var(--bs-link-color);
        border-bottom-color: var(--bs-link-color);
      }

      footer {
        flex-shrink: 0;
        border-top: 1px solid var(--bs-border-color);
        background-color: #161b22;
        color: var(--bs-secondary-color);
        font-size: 0.8rem;
        padding: 1rem 0;
        text-align: center;
      }

      footer .footer-copyright {
        margin-bottom: 0.4rem;
      }

      footer .footer-license {
        font-size: 0.72rem;
        line-height: 1.45;
        max-width: 40rem;
        margin-left: auto;
        margin-right: auto;
        color: var(--bs-secondary-color);
      }

      footer .footer-license a {
        color: var(--bs-secondary-color);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      footer .footer-license a:hover {
        color: var(--bs-link-color);
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand">
      <div class="container">
        <a class="navbar-brand" href="/">
          <img src="/static/pelorus-favicon-32.png" alt="" />
          <span class="pelorus-wordmark">Pelorus</span>
        </a>
        <div class="navbar-nav ms-auto gap-2 flex-row align-items-center">
          <a class="nav-link" href="/specifications/">Specifications</a>
          <a class="nav-link" href="/ecdis">ECDIS</a>
        </div>
      </div>
    </nav>

    <main>
      <div class="hero-shell">
        <div class="hero-bg-pelorus">
          <div id="pelorus-dial-root"></div>
        </div>
        <div class="hero-content-layer">
          <img
            class="tagline-hero-img"
            src="/static/pelorus-icon-200.png"
            alt="Pelorus"
          />
          <h1><span class="pelorus-wordmark">Pelorus</span></h1>
          <p class="tagline">By sailors, for sailors.</p>
          <a
            class="why-link"
            href="https://github.com/pelorus-marine/specifications#why-pelorus"
            target="_blank"
            rel="noopener noreferrer"
            >why pelorus?</a
          >
        </div>
      </div>
    </main>

    <script src="/static/js/pelorus-dial.js" defer></script>

    <footer>
      <div class="container">
        <div class="footer-copyright">&copy; {{ year }} Pelorus Marine</div>
        <div class="footer-license">
          Website source:
          <a
            href="https://opensource.org/licenses/MIT"
            target="_blank"
            rel="noopener noreferrer"
            >MIT</a
          >
          or
          <a
            href="https://www.apache.org/licenses/LICENSE-2.0"
            target="_blank"
            rel="noopener noreferrer"
            >Apache 2.0</a
          >, at your option. Pelorus name, logos, artwork on this site, and related
          branding are proprietary; all rights reserved.
        </div>
      </div>
    </footer>
  </body>
</html>
