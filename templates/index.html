{% extends "base.html" %}

{% block title %}Pelorus{% endblock %}

{% block page_style %}
    <style>
      main.pelorus-main {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      main.pelorus-main .pelorus-page-foreground {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .hero-content-layer h1 {
        font-size: 2.25rem;
        font-weight: 600;
        color: var(--bs-emphasis-color);
        margin-bottom: 0.75rem;
      }

      .hero-content-layer .tagline {
        font-style: italic;
        color: var(--bs-body-color);
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }

      .hero-content-layer .why-link {
        font-size: 0.85rem;
        color: var(--bs-secondary-color);
        text-decoration: none;
        border-bottom: 1px dotted var(--bs-secondary-color);
      }

      .hero-content-layer .why-link:hover {
        color: var(--bs-link-color);
        border-bottom-color: var(--bs-link-color);
      }
    </style>
{% endblock %}

{% block main_class %}pelorus-main{% endblock %}

{% block content %}
      <div class="hero-shell">
        <div class="hero-content-layer">
          <h1><span class="pelorus-wordmark">Pelorus</span></h1>
          <p class="tagline">By sailors, for sailors.</p>
          <a
            class="why-link"
            href="https://github.com/pelorus-marine/specifications#why-pelorus"
            target="_blank"
            rel="noopener noreferrer"
            >why pelorus?</a
          >
        </div>
      </div>
{% endblock %}
