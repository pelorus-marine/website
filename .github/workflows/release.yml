# Build container → GHCR + Artifact Registry → deploy Cloud Run (tags only).
# Cloud Run only accepts gcr.io, *.docker.pkg.dev, or docker.io — not ghcr.io directly.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Pass vars and secrets as separate step env keys (no `||` in expressions — avoids empty merges).
      # Prefer Variables; if empty, use Secrets with the same names.
      - name: Resolve GCP deploy configuration
        run: |
          merge() { local v="$1" s="$2"; if [ -n "$v" ]; then printf '%s' "$v"; else printf '%s' "$s"; fi; }
          echo "GCP_PROJECT_ID=$(merge "$VAR_PROJECT_ID" "$SECRET_PROJECT_ID")" >> "$GITHUB_ENV"
          echo "GCP_REGION=$(merge "$VAR_REGION" "$SECRET_REGION")" >> "$GITHUB_ENV"
          echo "CLOUD_RUN_SERVICE=$(merge "$VAR_SERVICE" "$SECRET_SERVICE")" >> "$GITHUB_ENV"
          echo "GCP_ARTIFACT_REPOSITORY=$(merge "$VAR_ARTIFACT" "$SECRET_ARTIFACT")" >> "$GITHUB_ENV"
        env:
          VAR_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SECRET_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VAR_REGION: ${{ vars.GCP_REGION }}
          SECRET_REGION: ${{ secrets.GCP_REGION }}
          VAR_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          SECRET_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          VAR_ARTIFACT: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          SECRET_ARTIFACT: ${{ secrets.GCP_ARTIFACT_REPOSITORY }}

      - name: Check GCP deploy configuration
        run: |
          missing=0
          hint="Settings → Secrets and variables → Actions → Variables or Secrets (names must match exactly)"
          [ -n "$GCP_PROJECT_ID" ] || { echo "::error::Missing GCP_PROJECT_ID — $hint"; missing=1; }
          [ -n "$GCP_REGION" ] || { echo "::error::Missing GCP_REGION — $hint"; missing=1; }
          [ -n "$CLOUD_RUN_SERVICE" ] || { echo "::error::Missing CLOUD_RUN_SERVICE — $hint"; missing=1; }
          [ -n "$GCP_ARTIFACT_REPOSITORY" ] || { echo "::error::Missing GCP_ARTIFACT_REPOSITORY (Artifact Registry Docker repo id) — $hint"; missing=1; }
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo build (release)
        run: cargo build --release --locked

      - name: Prepare image context
        run: ./scripts/prepare-image-context.sh

      - name: Image names
        id: image
        run: |
          echo "ghcr=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "gar=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/website" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR + Artifact Registry)
        uses: docker/build-push-action@v6
        with:
          context: build/image
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ghcr }}:${{ github.ref_name }}
            ${{ steps.image.outputs.ghcr }}:latest
            ${{ steps.image.outputs.gar }}:${{ github.ref_name }}
            ${{ steps.image.outputs.gar }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          image: ${{ steps.image.outputs.gar }}:${{ github.ref_name }}
          flags: --allow-unauthenticated --port=8080
