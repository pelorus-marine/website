# Build container → GHCR + Artifact Registry → deploy Cloud Run (tags only).
# Cloud Run only accepts gcr.io, *.docker.pkg.dev, or docker.io — not ghcr.io directly.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

# Non-secret deploy config: use Actions **Variables** (preferred) or **Secrets** with the same names.
env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || secrets.CLOUD_RUN_SERVICE }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || secrets.GCP_ARTIFACT_REPOSITORY }}

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check GCP deploy configuration
        run: |
          missing=0
          hint="(repository **Variables** or **Secrets** → Actions)"
          [ -n "$GCP_PROJECT_ID" ] || { echo "::error::Set GCP_PROJECT_ID $hint"; missing=1; }
          [ -n "$GCP_REGION" ] || { echo "::error::Set GCP_REGION $hint"; missing=1; }
          [ -n "$CLOUD_RUN_SERVICE" ] || { echo "::error::Set CLOUD_RUN_SERVICE $hint"; missing=1; }
          [ -n "$GCP_ARTIFACT_REPOSITORY" ] || { echo "::error::Set GCP_ARTIFACT_REPOSITORY (Artifact Registry Docker repo id) $hint"; missing=1; }
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo build (release)
        run: cargo build --release --locked

      - name: Prepare image context
        run: ./scripts/prepare-image-context.sh

      - name: Image names
        id: image
        run: |
          echo "ghcr=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "gar=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/website" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR + Artifact Registry)
        uses: docker/build-push-action@v6
        with:
          context: build/image
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ghcr }}:${{ github.ref_name }}
            ${{ steps.image.outputs.ghcr }}:latest
            ${{ steps.image.outputs.gar }}:${{ github.ref_name }}
            ${{ steps.image.outputs.gar }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          image: ${{ steps.image.outputs.gar }}:${{ github.ref_name }}
          flags: --allow-unauthenticated --port=8080
