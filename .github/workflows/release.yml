# Build container → GHCR → deploy Cloud Run. Runs only on version tags (e.g. v1.2.3).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  # Cloud Run pulls this image; use a public GHCR package or configure registry auth on the GCP side.
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          missing=0
          [ -n "$GCP_PROJECT_ID" ] || { echo "::error::Set repository variable GCP_PROJECT_ID"; missing=1; }
          [ -n "$GCP_REGION" ] || { echo "::error::Set repository variable GCP_REGION"; missing=1; }
          [ -n "$CLOUD_RUN_SERVICE" ] || { echo "::error::Set repository variable CLOUD_RUN_SERVICE"; missing=1; }
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo build (release)
        run: cargo build --release --locked

      - name: Prepare image context
        run: ./scripts/prepare-image-context.sh

      - name: Image name (GHCR must be lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build/image
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          image: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          flags: --allow-unauthenticated --port=8080
