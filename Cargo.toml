[package]
name = "website"
version = "0.1.14"
edition = "2024"
rust-version = "1.90.0"
license = "MIT OR Apache-2.0"
authors = ["Pelorus Marine contributors <https://github.com/pelorus-marine>"]
publish = false

[dependencies]
askama = "0.16.0"
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
warp = { version = "0.4.3", features = ["server", "test"] }

[dev-dependencies]
serial_test = "3"
temp-env = "0.3.6"
wiremock = "0.6"
